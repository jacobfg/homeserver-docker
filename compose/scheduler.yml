services:
  scheduler:
    container_name: scheduler
    image: ghcr.io/jacobfg/container-scheduler:0.1.3@sha256:afe0814ac4db186ceb126dc3a55641e15ba50874d2a98a9f9a8febb19339da91
    restart: unless-stopped
    user: '65532:65532'
    read_only: true
    tmpfs:
      - /run/container-scheduler:uid=65532,gid=65532,mode=0700,size=1m
    cap_drop:
      - ALL
    security_opt:
      - 'no-new-privileges:true'
    environment:
      - TZ
      - DOCKER_HOST=tcp://scheduler-socket-proxy:2375
      - DOCKER_API_TIMEOUT=15s
      - CONTAINER_LABEL_SELECTOR=container-scheduler.scope=libation
      - LABEL_PREFIX=ofelia
    networks: [scheduler_socket_proxy]
    depends_on:
      scheduler-socket-proxy:
        condition: service_healthy
    mem_limit: 64m
    memswap_limit: 64m
    cpus: 0.5
    cpu_shares: 256
    logging:
      driver: local
      options:
        max-size: '5m'
        max-file: '2'
    labels:
      traefik.enable: 'false'
      container-scheduler.scope: libation
      ofelia.enabled: 'true'
      ofelia.service: 'true'
      ofelia.job-run.libation.schedule: '@every 4h'
      ofelia.job-run.libation.container: libation
      ofelia.job-run.libation.no-overlap: 'true'
      ofelia.job-run.libation.delete: 'false'

  scheduler-socket-proxy:
    container_name: scheduler-socket-proxy
    image: wollomatic/socket-proxy:1.13.2@sha256:ff95d6ff6c27853005ef85eb8f4ab5923dc3d2f1e055f98fb6aeeaceec3fe848
    restart: unless-stopped
    user: '0:0'
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - 'no-new-privileges:true'
    command:
      - '-listenip=0.0.0.0'
      - '-allowfrom=scheduler'
      - '-allowHEAD=(/v[0-9]+[.][0-9]+)?/(_ping|version)'
      - '-allowGET=(/v[0-9]+[.][0-9]+)?/(_ping|version|containers/json|containers/libation/json)'
      - '-allowPOST=(/v[0-9]+[.][0-9]+)?/containers/libation/start'
      - '-allowhealthcheck'
      - '-watchdoginterval=60'
      - '-stoponwatchdog'
      - '-loglevel=warn'
    environment:
      - GOMEMLIMIT=48MiB
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - scheduler_socket_proxy
    healthcheck:
      test: [CMD, /healthcheck]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    mem_limit: 64m
    memswap_limit: 64m
    cpus: 0.5
    logging:
      driver: local
      options:
        max-size: '5m'
        max-file: '2'
    labels:
      - traefik.enable=false
