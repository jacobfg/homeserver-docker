services:
  fittools:
    container_name: fittools
    image: ghcr.io/jacobfg/fittools:0.2.2@sha256:8f3cd3094ee74f5be7a8844a00475a10d820f8b3cbe74013c4932688f781b2f9
    restart: unless-stopped
    user: $PUID:$PGID
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 128M
    environment:
      - TZ=$TZ
      - FIT_DEVICE_PRESETS_FILE=/config/device-presets.json
    configs:
      - source: fittools_device_presets
        target: /config/device-presets.json
    networks:
      - fittools_internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=fittools_internal"
      ## HTTP Routers
      - "traefik.http.routers.fittools-rtr.entrypoints=https"
      - "traefik.http.routers.fittools-rtr.rule=Host(`fittools.$DOMAINNAME_CLOUD_SERVER`)"
      - "traefik.http.routers.fittools-rtr.tls=true"
      ## Middlewares
      - "traefik.http.routers.fittools-rtr.middlewares=chain-authelia@file"
      ## HTTP Services
      - "traefik.http.routers.fittools-rtr.service=fittools-svc"
      - "traefik.http.services.fittools-svc.loadbalancer.server.port=8080"

configs:
  fittools_device_presets:
    file: ../config/fittools/device-presets.json
