services:
  libation:
    extends:
      file: base.yml
      service: base
    # Explicitly created by the updater; ordinary `compose up` must not run this job.
    profiles: [scheduled]
    # Background imports/conversion can run more slowly when interactive services are busy.
    deploy:
      resources:
        limits:
          cpus: '2.0' # Aggregate ceiling; does not reserve or pin two cores.
          memory: 4G # Forced execution peaked at ~2.35 GiB; monitor larger conversions.
        reservations:
          memory: 128M # Soft reservation, not preallocated RAM.
    cpu_shares: 256 # Lower relative priority under contention (default is 1024).
    container_name: libation
    image: rmcrackan/libation:14.2.2@sha256:fe188ac3c4ce63cc305971c76e648748341427e16bcf884011da8a384fd3908c
    restart: "no" # The scheduler starts each run; do not loop after successful completion.
    tmpfs:
      - /config-internal:uid=$PUID,gid=$PGID,mode=0700,size=1m
    secrets:
      - libation_key
    environment:
      - LIBATION_MASTER_KEY_FILE=/run/secrets/libation_key
      - LIBATION_DB_DIR=/db
      - SLEEP_TIME=-1 # Run one scan/download cycle, then release process memory.
    configs:
      - source: libation_accounts_settings
        target: /config/AccountsSettings.json
      - source: libation_settings
        target: /config/Settings.json
    volumes:
      # use secrets ?
      # - $VOLUME_DIR/libation/config:/config
      - $VOLUME_DIR/libation/db:/db
      - $VOLUME_DIR/audiobookshelf/audiobooks/$ABS_LIBRARY1_DIR:/data:ro
      - $VOLUME_DIR/libation/logs:/logs
    networks:
      - t2_proxy
    labels:
      - "traefik.enable=false"

configs:
  libation_settings:
    file: ../config/libation/settings.json
  libation_accounts_settings:
    file: ../config/libation/accountssettings.json

secrets:
  libation_key:
    file: $SECRETS_DIR/libation_key
