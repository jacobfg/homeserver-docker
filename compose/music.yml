# Included by the root compose.yaml; run Compose from the repository root.
services:
  music-assistant:
    extends:
      file: base.yml
      service: base-logged
    container_name: music-assistant
    image: ghcr.io/music-assistant/server:2.10.9@sha256:4ac0d5844363fbbefd6a61251df09d96cd546e05e01b8c1cc1a28803f0935e07
    # Required for multicast discovery and direct streaming to LAN players.
    network_mode: host
    init: true
    deploy:
      resources:
        limits:
          memory: 4G # Initial ceiling; validate library scans and concurrent transcoding.
        reservations:
          memory: 512M # Soft reservation, not preallocated RAM.
    cpu_shares: 1024 # Keep home automation's higher priority under contention.
    environment:
      - HOME=/data
      - LOG_LEVEL=info
    volumes:
      - $VOLUME_DIR/music-assistant/data:/data
      - $VOLUME_DIR/music-assistant/music:/media:ro
    tmpfs:
      - /tmp:uid=$PUID,gid=$PGID,mode=1777,size=256m
    labels:
      - "traefik.enable=true"
      ## HTTP Routers
      - "traefik.http.routers.music-assistant-rtr.entrypoints=https"
      - "traefik.http.routers.music-assistant-rtr.rule=Host(`music.$DOMAINNAME_CLOUD_SERVER`)"
      - "traefik.http.routers.music-assistant-rtr.tls=true"
      ## Middlewares
      - "traefik.http.routers.music-assistant-rtr.middlewares=chain-authelia@file"
      ## HTTP Services
      - "traefik.http.routers.music-assistant-rtr.service=music-assistant-svc"
      - "traefik.http.services.music-assistant-svc.loadbalancer.server.url=http://$DOCKER_SERVER_IP:8095/"
    extra_hosts:
      # Both services share the host network; HA is reachable over loopback.
      - "homeassistant:127.0.0.1"
      # Use Traefik's internal ABS bridge and existing source-subnet bypass.
      - "audiobookshelf.$DOMAINNAME_CLOUD_SERVER:192.168.92.254"
