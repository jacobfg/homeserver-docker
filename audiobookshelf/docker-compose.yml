# deploy weight 50

# use existing t2_proxy network defined by docker-env stack
networks:
  t2_proxy:
    name: t2_proxy
    external: true
  abs_green_internal:
    name: abs_green_internal
    external: true

services:
  audiobookshelf:
    container_name: audiobookshelf
    image: ghcr.io/advplyr/audiobookshelf:2.37.1@sha256:581d68b2a6fc7ebf58d81c878a9f387cbbc0d88ac9d37b298b9cee10168af85b
    restart: unless-stopped
    volumes:
      - $VOLUME_DIR/audiobookshelf/audiobooks:/audiobooks:ro
      - $VOLUME_DIR/audiobookshelf/podcasts:/podcasts:ro
      - $VOLUME_DIR/audiobookshelf/config:/config
      - $VOLUME_DIR/audiobookshelf/metadata:/metadata
    environment:
      - TZ=$TZ
      - AUDIOBOOKSHELF_UID=$PUID
      - AUDIOBOOKSHELF_GID=$PGID
      - PORT=8088
    networks:
      - t2_proxy
    labels:
      - "traefik.enable=true"
      ## HTTP Routers
      - "traefik.http.routers.audiobookshelf-rtr.entrypoints=https"
      - "traefik.http.routers.audiobookshelf-rtr.priority=1" # FOR ALLOWING LOCAL ACCESS
      - "traefik.http.routers.audiobookshelf-rtr.rule=Host(`audiobookshelf.$DOMAINNAME_CLOUD_SERVER`)"
      - "traefik.http.routers.audiobookshelf-rtr.tls=true"
      ## Middlewares
      - "traefik.http.routers.audiobookshelf-rtr.middlewares=chain-authelia@file"
      ## HTTP Services
      - "traefik.http.routers.audiobookshelf-rtr.service=audiobookshelf-svc"
      - "traefik.http.services.audiobookshelf-svc.loadbalancer.server.port=8088"
      ## LOCAL ACCESS - Allow local (home) access without traefik auth
      ## HTTP Routers
      - "traefik.http.routers.audiobookshelf-bypass-rtr.entrypoints=https"
      - "traefik.http.routers.audiobookshelf-bypass-rtr.priority=99"
      # - "traefik.http.routers.audiobookshelf-bypass-rtr.rule=Host(`audiobookshelf.$DOMAINNAME_CLOUD_SERVER`) && ClientIP(`192.168.0.0/16`)"
      # || PathPrefix(`/s/`)
      # (PathPrefix(`/api`) || PathPrefix(`/socket.io`) || PathPrefix(`/manifest.json`) || PathPrefix(`/auth`)) &&
      # - "traefik.http.routers.audiobookshelf-bypass-rtr.rule=Host(`audiobookshelf.$DOMAINNAME_CLOUD_SERVER`) && ( (Method(`POST`) && Path(`/auth/openid`) && Query(`scope=openid`)) || (Method(`GET`) && Path(`/auth/openid`) && Query(`scope=openid`)) || (Method(`GET`) && Path(`/api/oidc/authorization`) && Query(`scope=openid`)) || (Method(`GET`) && (Path(`/`) && Query(`flow=openid_connect`)) ) && ClientIP(`$ABS_BYPASS_CIDR`)"
      # - "traefik.http.routers.audiobookshelf-bypass-rtr.rule=Host(`audiobookshelf.$DOMAINNAME_CLOUD_SERVER`) && ( PathPrefix(`/api/`) || PathPrefix(`/socket.io`) || PathPrefix(`/manifest.json`) || PathPrefix(`/auth`)) || (Method(`GET`) && (Path(`/`) && Query(`flow=openid_connect`)) ) && ClientIP(`$ABS_BYPASS_CIDR`)"
      - "traefik.http.routers.audiobookshelf-bypass-rtr.rule=Host(`audiobookshelf.$DOMAINNAME_CLOUD_SERVER`) && (ClientIP(`$ABS_BYPASS1_CIDR`) || ClientIP(`$ABS_BYPASS2_CIDR`) || ClientIP(`192.168.92.0/24`))"
      - "traefik.http.routers.audiobookshelf-bypass-rtr.tls=true"
      ## Middlewares
      - "traefik.http.routers.audiobookshelf-bypass-rtr.middlewares=chain-no-auth@file"
      ## HTTP Services
      - "traefik.http.routers.audiobookshelf-bypass-rtr.service=audiobookshelf-svc"
      ## GARMIN WATCH API - custom hostname; normal ABS hostname is unchanged.
      # Authentication is the watch's ABS Bearer token, passed through to ABS.
      - "traefik.http.routers.audiobookshelf-garmin-api-rtr.entrypoints=https"
      - "traefik.http.routers.audiobookshelf-garmin-api-rtr.priority=100"
      - "traefik.http.routers.audiobookshelf-garmin-api-rtr.rule=Host(`garmin-abs.$DOMAINNAME_CLOUD_SERVER`) && PathPrefix(`/api/`)"
      - "traefik.http.routers.audiobookshelf-garmin-api-rtr.tls=true"
      - "traefik.http.routers.audiobookshelf-garmin-api-rtr.middlewares=chain-no-auth@file"
      - "traefik.http.routers.audiobookshelf-garmin-api-rtr.service=audiobookshelf-svc"
    extra_hosts:
      - "auth.$DOMAINNAME_CLOUD_SERVER:$DOCKER_SERVER_IP" # required for oidc auth

  # TODO: replace
  filebrowser:
    container_name: filebrowser
    image: filebrowser/filebrowser@sha256:a469ea076d4a1b4b1d86a41d130f2f536cd9da996a2b1fb39c0d7635f9d89b9a
    restart: unless-stopped
    user: $PUID:$PGID
    volumes:
      - $VOLUME_DIR/filebrowser/database:/database
      - $VOLUME_DIR/filebrowser/config:/config
      - $VOLUME_DIR/audiobookshelf/audiobooks:/srv/audiobooks
    environment:
      - TZ=$TZ
    networks:
      - t2_proxy
    labels:
      - "traefik.enable=true"
      ## HTTP Routers
      - "traefik.http.routers.filebrowser-rtr.entrypoints=https"
      - "traefik.http.routers.filebrowser-rtr.rule=Host(`filebrowser.$DOMAINNAME_CLOUD_SERVER`)"
      - "traefik.http.routers.filebrowser-rtr.tls=true"
      ## Middlewares
      - "traefik.http.routers.filebrowser-rtr.middlewares=middlewares-homer-cors@file,chain-authelia@file"
      ## HTTP Services
      - "traefik.http.routers.filebrowser-rtr.service=filebrowser-svc"
      - "traefik.http.services.filebrowser-svc.loadbalancer.server.port=8080"

  abs_green_proxy:
    container_name: abs_green_proxy
    image: ghcr.io/jacobfg/audiobooksgreenproxy:latest@sha256:5f2d2062a85ea66f4c444a082165f8de72646a6b831a09700eec2c566f004b6f
    restart: unless-stopped
    user: $PUID:$PGID
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 256M
    environment:
      - TZ=$TZ
      - SHOW_SWAGGER=false
      - LOG_LEVEL=warning
      - SERVER_ENDPOINT=https://audiobookshelf.$DOMAINNAME_CLOUD_SERVER
    volumes:
      - $VOLUME_DIR/abs_green_proxy/data:/data
    init: true
    networks:
      - abs_green_internal
    expose:
      - "8081"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=abs_green_internal"
      ## HTTP Routers
      - "traefik.http.routers.abs-green-proxy-rtr.entrypoints=https"
      - "traefik.http.routers.abs-green-proxy-rtr.priority=1" # FOR ALLOWING LOCAL ACCESS
      - "traefik.http.routers.abs-green-proxy-rtr.rule=Host(`abs-green-proxy.$DOMAINNAME_CLOUD_SERVER`)"
      - "traefik.http.routers.abs-green-proxy-rtr.tls=true"
      ## Middlewares
      - "traefik.http.routers.abs-green-proxy-rtr.middlewares=chain-authelia@file"
      ## HTTP Services
      - "traefik.http.routers.abs-green-proxy-rtr.service=abs-green-proxy-svc"
      - "traefik.http.services.abs-green-proxy-svc.loadbalancer.server.port=8081"
      - "traefik.http.services.abs-green-proxy-svc.loadbalancer.responseforwarding.flushinterval=1ms"
      ## LOCAL ACCESS - Allow local (home) access without traefik auth
      ## HTTP Routers
      - "traefik.http.routers.abs-green-proxy-local-rtr.entrypoints=https"
      - "traefik.http.routers.abs-green-proxy-local-rtr.priority=99"
      - "traefik.http.routers.abs-green-proxy-local-rtr.rule=Host(`abs-green-proxy.$DOMAINNAME_CLOUD_SERVER`) && ClientIP(`192.168.0.0/16`)" # Really just the devices with AudioBookShelf Green App
      - "traefik.http.routers.abs-green-proxy-local-rtr.tls=true"
      ## Middlewares
      - "traefik.http.routers.abs-green-proxy-local-rtr.middlewares=chain-no-auth@file"
      ## HTTP Services
      - "traefik.http.routers.abs-green-proxy-local-rtr.service=abs-green-proxy-svc"
      ## GARMIN WATCH PROXY - specific sidecar routes have higher priority.
      - "traefik.http.routers.abs-green-garmin-proxy-rtr.entrypoints=https"
      - "traefik.http.routers.abs-green-garmin-proxy-rtr.priority=100"
      - "traefik.http.routers.abs-green-garmin-proxy-rtr.rule=Host(`garmin-abs.$DOMAINNAME_CLOUD_SERVER`) && PathPrefix(`/audiobookshelf/`)"
      - "traefik.http.routers.abs-green-garmin-proxy-rtr.tls=true"
      - "traefik.http.routers.abs-green-garmin-proxy-rtr.middlewares=chain-no-auth@file"
      - "traefik.http.routers.abs-green-garmin-proxy-rtr.service=abs-green-proxy-svc"
    extra_hosts:
      - "audiobookshelf.$DOMAINNAME_CLOUD_SERVER:192.168.92.254" # doesn't have access to lan ip

  garmin_media_sidecar:
    container_name: garmin_media_sidecar
    image: ghcr.io/jacobfg/audiobooksgreengarminsidecar:latest@sha256:bfd7a9be89338a7d34aef46ec04d4a27303a3df1fac36e53672d07af8a4a933f
    restart: unless-stopped
    user: $PUID:$PGID
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
    environment:
      - TZ=$TZ
      # Direct Docker-network access: no Traefik or Authelia loop for polling,
      # token validation, or source-media downloads.
      - ABS_URL=https://audiobookshelf.$DOMAINNAME_CLOUD_SERVER
      - ABS_TOKEN=$ABS_GREEN_SIDECAR_ABS_TOKEN
      - SIDECAR_CONFIG=/app/config.yaml
      - CACHE_DIR=/app/cache
      - POLL_INTERVAL_SECONDS=300
      - AUTH_CACHE_SECONDS=300
      - CACHE_CHUNK_MINUTES=30
      - CACHE_BITRATE=96k
    volumes:
      - $VOLUME_DIR/abs_green_sidecar/config.yaml:/app/config.yaml:ro
      - $VOLUME_DIR/abs_green_sidecar/cache:/app/cache
    networks:
      - abs_green_internal
    expose:
      - "8082"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=abs_green_internal"
      ## Virtual playlist catalogue and Garmin chunk manifest.
      - "traefik.http.routers.garmin-media-catalogue-rtr.entrypoints=https"
      - "traefik.http.routers.garmin-media-catalogue-rtr.priority=200"
      - "traefik.http.routers.garmin-media-catalogue-rtr.rule=Host(`garmin-abs.$DOMAINNAME_CLOUD_SERVER`) && (Path(`/audiobookshelf/playlists`) || Path(`/audiobookshelf/playlist`) || Path(`/audiobookshelf/book`) || PathPrefix(`/garmin/playlist-status/`))"
      - "traefik.http.routers.garmin-media-catalogue-rtr.tls=true"
      - "traefik.http.routers.garmin-media-catalogue-rtr.middlewares=chain-no-auth@file"
      - "traefik.http.routers.garmin-media-catalogue-rtr.service=garmin-media-svc"
      ## Garmin-rendered MP3 downloads, not ABS originals.
      - "traefik.http.routers.garmin-media-download-rtr.entrypoints=https"
      - "traefik.http.routers.garmin-media-download-rtr.priority=200"
      - "traefik.http.routers.garmin-media-download-rtr.rule=Host(`garmin-abs.$DOMAINNAME_CLOUD_SERVER`) && PathRegexp(`^/api/items/[^/]+/file/[^/]+/download`)"
      - "traefik.http.routers.garmin-media-download-rtr.tls=true"
      - "traefik.http.routers.garmin-media-download-rtr.middlewares=chain-no-auth@file"
      - "traefik.http.routers.garmin-media-download-rtr.service=garmin-media-svc"
      - "traefik.http.services.garmin-media-svc.loadbalancer.server.port=8082"
    extra_hosts:
      - "audiobookshelf.$DOMAINNAME_CLOUD_SERVER:192.168.92.254" # doesn't have access to lan ip
