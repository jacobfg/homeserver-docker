# deploy weight 10

########################### NETWORKS
# There is no need to create any networks outside this docker-compose file.
# You may customize the network subnets (192.168.90.0/24 and 91.0/24) below as you please.
# Docker Compose version 3.5 or higher required to define networks this way.

networks:
  t2_proxy:
    name: t2_proxy
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.90.0/24
  default:
    driver: bridge
  traefik_socket_proxy:
    internal: true
    driver: bridge
  socket_proxy:
    name: socket_proxy
    internal: true
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.91.0/24
  abs_green_internal:
    name: abs_green_internal
    internal: true
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.92.0/24

########################### SECRETS
secrets:
  authelia_jwt_secret:
    file: $SECRETS_DIR/authelia_jwt_secret
  authelia_session_secret:
    file: $SECRETS_DIR/authelia_session_secret
  authelia_storage_encryption_key:
    file: $SECRETS_DIR/authelia_storage_encryption_key
  authelia_identity_providers_oidc_hmac_secret_file:
    file: $SECRETS_DIR/authelia_identity_providers_oidc_hmac_secret_file
  authelia_identity_providers_oidc_issuer_certificate_chain_file:
    file: $SECRETS_DIR/authelia_identity_providers_oidc_issuer_certificate_chain_file
  authelia_identity_providers_oidc_issuer_private_key_file:
    file: $SECRETS_DIR/authelia_identity_providers_oidc_issuer_private_key_file
  zigbee2mqtt_secrets.yaml:
    file: $SECRETS_DIR/zigbee2mqtt_secrets.yaml
  cf_dns_api_key:
    file: $SECRETS_DIR/cf_dns_api_key
  influxdb_user:
    file: $SECRETS_DIR/influxdb_user
  influxdb_password:
    file: $SECRETS_DIR/influxdb_password
  influxdb_admin_token:
    file: $SECRETS_DIR/influxdb_admin_token

########################### EXTENSION FIELDS
# Helps eliminate repetition of sections
# More Info on how to use this: https://github.com/htpcBeginner/docker-traefik/pull/228

# Common environment values
x-environment: &default-tz-puid-pgid
  TZ: $TZ
  PUID: $PUID
  PGID: $PGID

# Keys common to some of the core services that we always to automatically restart on failure
x-common-keys-core: &common-keys-core
  networks:
    - t2_proxy
  security_opt:
    - no-new-privileges:true
  restart: always

# Keys common to some of the dependent services/apps
x-common-keys-apps: &common-keys-apps
  networks:
    - t2_proxy
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

# Keys common to some of the dependent services/apps
x-common-keys-apps-hostmode: &common-keys-apps-hostmode
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

########################### SERVICES
services:
  ############################# FRONTENDS
  # Traefik 3 - Reverse Proxy
  traefik:
    <<: *common-keys-core # See EXTENSION FIELDS at the top
    container_name: traefik
    image: traefik:v3.7.14@sha256:e849695bc5c317da0cec22bfee4794fd9e15871fe554f864d31b625983e883ff
    # Initial budget; validate under concurrent uploads, streaming and stack updates.
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M # Soft reservation; does not preallocate RAM.
    memswap_limit: 512m # Combined RAM + swap limit; equal to RAM disables swap.
    cpu_shares: 2048 # Prefer the proxy under CPU contention; allow bursts without a CPU cap.
    # Prepare file ownership and run the checks in traefik/NONROOT-ROLLOUT.md first.
    user: "65532:65532"
    cap_drop:
      - ALL
    sysctls:
      # Container network namespace only; preserve HTTPS :443 without a bind capability.
      net.ipv4.ip_unprivileged_port_start: "443"
    # Bound combined access/runtime logs; read them with docker logs traefik.
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    command: # CLI arguments
      - --global.checkNewVersion=false
      - --global.sendAnonymousUsage=false
      - --entryPoints.https.address=:443
      - --entryPoints.sftp.address=:2021
      # Clients connect directly; Cloudflare provides DNS only. Trust no upstream proxy headers.
      - --entrypoints.https.forwardedHeaders.insecure=false
      # - --entryPoints.traefik.address=:8080
      - --api=true
      - --api.dashboard=true
      - --log=true
      - --log.format=json # stdout/stderr are rotated by Docker below the size limit
      - --log.level=ERROR # (Default: error) DEBUG, INFO, WARN, ERROR, FATAL, PANIC
      - --accessLog=true
      - --accessLog.format=json
      - --accessLog.addInternals=true # Include dashboard/API access as well
      - --accessLog.bufferingSize=100 # Async queue; continuously drained, not a batch threshold
      # Keep status, router, client address and timing metadata for all HTTP statuses.
      - --accessLog.fields.defaultMode=keep
      - --accessLog.fields.headers.defaultMode=drop # Omit cookies, authorization and API keys
      - --accessLog.fields.queryParameters.defaultMode=drop
      - --accessLog.fields.names.ClientUsername=drop
      # Paths may contain HA webhook IDs or other credentials; omit derived request lines too.
      - --accessLog.fields.names.RequestPath=drop
      - --accessLog.fields.names.RequestLine=drop
      - --providers.docker=true
      - --providers.docker.endpoint=tcp://traefik-socket-proxy:2375
      - --providers.docker.exposedByDefault=false
      - --entrypoints.https.http.tls.options=tls-opts@file
      # Add dns-cloudflare as default certresolver for all services. Also enables TLS and no need to specify on individual services
      - --entrypoints.https.http.tls.certresolver=dns-cloudflare
      - --entrypoints.https.http.tls.domains[0].main=$DOMAINNAME_CLOUD_SERVER
      - --entrypoints.https.http.tls.domains[0].sans=*.$DOMAINNAME_CLOUD_SERVER
      # - --entrypoints.https.http.tls.domains[1].main=$DOMAINNAME2 # Pulls main cert for second domain
      # - --entrypoints.https.http.tls.domains[1].sans=*.$DOMAINNAME2 # Pulls wildcard cert for second domain
      - --providers.docker.network=t2_proxy
      # - --providers.docker.swarmMode=false
      - --providers.file.directory=/rules # Load dynamic configuration from one or more .toml or .yml files in a directory
      - --providers.file.watch=true # Only works on top level files in the rules folder
      # - --certificatesResolvers.dns-cloudflare.acme.caServer=https://acme-staging-v02.api.letsencrypt.org/directory # LetsEncrypt Staging Server - uncomment when testing
      - --certificatesResolvers.dns-cloudflare.acme.email=$CLOUDFLARE_EMAIL
      - --certificatesResolvers.dns-cloudflare.acme.storage=/acme.json
      - --certificatesResolvers.dns-cloudflare.acme.dnsChallenge.provider=cloudflare
      - --certificatesResolvers.dns-cloudflare.acme.dnsChallenge.resolvers=1.1.1.1:53,1.0.0.1:53
      - --certificatesResolvers.dns-cloudflare.acme.dnsChallenge.delayBeforeCheck=90 # To delay DNS check and reduce LE hitrate
    networks:
      t2_proxy:
        ipv4_address: 192.168.90.254 # You can specify a static IP
      abs_green_internal:
        ipv4_address: 192.168.92.254
      traefik_socket_proxy:
    depends_on:
      - traefik-socket-proxy
    ports:
      - target: 443
        published: 443
        protocol: tcp
        mode: host
      - target: 2021
        published: 2021
        protocol: tcp
        mode: host
    configs:
      - source: traefik_rules_esphome
        target: /rules/esphome.yml
      - source: traefik_rules_tls_opts
        target: /rules/tls-opts.yml
      - source: traefik_rules_printerscanner
        target: /rules/printerscanner.yml
      - source: traefik_printerscanner_certificate
        target: /certs/printerscanner.pem
      - source: traefik_rules_middlewares_chains
        target: /rules/middlewares-chains.yml
      - source: traefik_rules_middlewares
        target: /rules/middlewares.yml
      - source: traefik_rules_immich
        target: /rules/immich.yml
    volumes:
      - $VOLUME_DIR/traefik/acme/acme.json:/acme.json # Preserve existing certificates; owner 65532:65532, mode 0600.
    environment:
      - TZ
      - CF_DNS_API_TOKEN_FILE=/run/secrets/cf_dns_api_key
      - CF_ZONE_API_TOKEN_FILE=/run/secrets/cf_dns_api_key
      - GOMEMLIMIT=384MiB # Go soft memory target; leave headroom below the container limit.
      - DOMAINNAME_CLOUD_SERVER # Passing the domain name to the traefik container to be able to use the variable in rules.
      - DOCKER_SERVER_IP # Passing the docker server IP to the traefik container to be able to use the variable in rules.
    secrets:
      - cf_dns_api_key
    labels:
      - "traefik.enable=true"
      # HTTP Routers
      - "traefik.http.routers.traefik-rtr.entrypoints=https"
      - "traefik.http.routers.traefik-rtr.priority=1"
      - "traefik.http.routers.traefik-rtr.rule=Host(`traefik.$DOMAINNAME_CLOUD_SERVER`)"
      - "traefik.http.routers.traefik-rtr.tls=true" # Some people had 404s without this
      # - "traefik.http.routers.traefik-rtr.tls.certresolver=dns-cloudflare" # Comment out this line after first run of traefik to force the use of wildcard certs
      - "traefik.http.routers.traefik-rtr.tls.domains[0].main=$DOMAINNAME_CLOUD_SERVER"
      - "traefik.http.routers.traefik-rtr.tls.domains[0].sans=*.$DOMAINNAME_CLOUD_SERVER"
      # - "traefik.http.routers.traefik-rtr.tls.domains[1].main=$DOMAINNAME2" # Pulls main cert for second domain
      # - "traefik.http.routers.traefik-rtr.tls.domains[1].sans=*.$DOMAINNAME2" # Pulls wildcard cert for second domain
      ## Services - API
      - "traefik.http.routers.traefik-rtr.service=api@internal"
      ## Middlewares
      - "traefik.http.routers.traefik-rtr.middlewares=middlewares-homer-cors@file,middlewares-admin-headers@file,chain-authelia@file"

  # Dedicated discovery proxy: only Traefik joins this internal network; no published ports.
  traefik-socket-proxy:
    <<: *common-keys-core
    container_name: traefik-socket-proxy
    image: ghcr.io/tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    # Initial bounds; verify peak usage during stack updates and Docker discovery.
    deploy:
      resources:
        limits:
          cpus: '0.50' # Maximum half of one CPU core.
          memory: 128M
        reservations:
          memory: 32M # Soft reservation in Compose, not a guaranteed minimum.
    memswap_limit: 128m # RAM + swap equals the RAM limit: disable container swap.
    cpu_shares: 2048 # Higher relative CPU weight under contention (default is 1024).
    networks:
      - traefik_socket_proxy
    volumes:
      # The API ACLs below restrict operations; a read-only socket mount alone does not.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - LOG_LEVEL=warning
      - CONTAINERS=1
      - EVENTS=1
      - PING=1
      - VERSION=1
      - POST=0
      # All other API sections are denied by this pinned image's defaults.
    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "2"
    labels:
      - "traefik.enable=false"

  # Portainer's existing Docker Socket Proxy
  socket-proxy:
    <<: *common-keys-core # See EXTENSION FIELDS at the top
    container_name: socket-proxy
    image: ghcr.io/tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    # Initial bounds; verify peak usage while browsing Portainer and streaming logs.
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 128M
        reservations:
          memory: 32M # Soft reservation in Compose, not preallocated RAM.
    memswap_limit: 128m # Disable container swap; this is the combined RAM + swap limit.
    cpu_shares: 1024 # Normal relative CPU weight; Compose cannot guarantee a CPU minimum.
    networks:
      socket_proxy:
        ipv4_address: 192.168.91.254 # You can specify a static IP
    # privileged: true # true for VM. False for unprivileged LXC container.
    ports:
      - 127.0.0.1:2375:2375 # Port 2375 should only ever get exposed to the internal network. When possible use this line.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - LOG_LEVEL=warning # debug,info,notice,warning,err,crit,alert,emerg
      ## Variables match the URL prefix (i.e. AUTH blocks access to /auth/* parts of the API, etc.).
      # 0 to revoke access.
      # 1 to grant access.
      ## Granted by Default
      - EVENTS=1
      - PING=1
      - VERSION=1
      ## Revoked by Default
      # Security critical
      - AUTH=0
      - SECRETS=0
      - POST=0 # portainer
      # Not always needed
      - BUILD=0
      - COMMIT=0
      - CONFIGS=0
      - CONTAINERS=1 # Traefik, portainer, etc.
      - DISTRIBUTION=0
      - EXEC=0
      - IMAGES=1 # Portainer
      - INFO=1 # Portainer
      - NETWORKS=1 # Portainer
      - NODES=0
      - PLUGINS=0
      - SERVICES=1 # Portainer
      - SESSION=0
      - SWARM=0
      - SYSTEM=0
      - TASKS=1 # Portainer
      - VOLUMES=1 # Portainer
    labels: []

  # Light Split Horizon / Ad Blocking DNS Server
  # TODO: try adblock
  blocky:
    <<: *common-keys-core # See EXTENSION FIELDS at the top
    deploy:
      resources:
        limits:
          memory: 128M # Observed peak ~33 MiB; recheck during blocklist refreshes.
        reservations:
          memory: 32M # Soft reservation, not preallocated RAM.
    cpu_shares: 2048 # Prioritise DNS under CPU contention; no hard CPU ceiling.
    image: spx01/blocky:v0.22@sha256:ba17812054a15b58ac80772afe404e7caa1da8c972f0c9ff7754eb3924fd5f57
    container_name: blocky
    restart: always
    ports:
      - 53:53/tcp
      - 53:53/udp
    environment:
      - TZ
    volumes:
      - $VOLUME_DIR/blocky/config.yml:/app/config.yml
    labels:
      - "traefik.enable=false"
    extra_hosts:
      - "audiobookshelf.$DOMAINNAME_CLOUD_SERVER:$DOCKER_SERVER_IP"
      - "auth.$DOMAINNAME_CLOUD_SERVER:$DOCKER_SERVER_IP"
      - "duplicacy.$DOMAINNAME_CLOUD_SERVER:$DOCKER_SERVER_IP"
      - "esphome.$DOMAINNAME_CLOUD_SERVER:$DOCKER_SERVER_IP"
      - "filebrowser.$DOMAINNAME_CLOUD_SERVER:$DOCKER_SERVER_IP"
      - "home.$DOMAINNAME_CLOUD_SERVER:$DOCKER_SERVER_IP"
      - "homeassistant.$DOMAINNAME_CLOUD_SERVER:$DOCKER_SERVER_IP"
      - "influxdb.$DOMAINNAME_CLOUD_SERVER:$DOCKER_SERVER_IP"
      - "nodered.$DOMAINNAME_CLOUD_SERVER:$DOCKER_SERVER_IP"
      - "portainer.$DOMAINNAME_CLOUD_SERVER:$DOCKER_SERVER_IP"
      - "printerscanner.$DOMAINNAME_CLOUD_SERVER:$DOCKER_SERVER_IP"
      - "sftp.$DOMAINNAME_CLOUD_SERVER:$DOCKER_SERVER_IP"
      - "static.$DOMAINNAME_CLOUD_SERVER:$DOCKER_SERVER_IP"
      - "traefik.$DOMAINNAME_CLOUD_SERVER:$DOCKER_SERVER_IP"
      - "zigbee2mqtt.$DOMAINNAME_CLOUD_SERVER:$DOCKER_SERVER_IP"
      - "photos.$DOMAINNAME_CLOUD_SERVER:$DOCKER_SERVER_IP"
      - "fittools.$DOMAINNAME_CLOUD_SERVER:$DOCKER_SERVER_IP"
      - "garmin-abs.$DOMAINNAME_CLOUD_SERVER:$DOCKER_SERVER_IP"

  # Authelia (Lite) - Self-Hosted Single Sign-On and Two-Factor Authentication
  authelia:
    <<: *common-keys-core # See EXTENSION FIELDS at the top
    container_name: authelia
    image: authelia/authelia:4.39.28@sha256:bd97cff4fcbf715b5ff1f9ae286afbe6033afce385302520b0368122d43a6f54
    restart: always
    networks:
      - t2_proxy
    volumes:
      - $VOLUME_DIR/authelia:/config
    configs:
      - source: authelia_configuration
        target: /etc/authelia/configuration.yml
    deploy:
      resources:
        limits:
          cpus: '0.25'    # Caps CPU usage to a quarter of a single core
          memory: 256M    # 96 MiB caused confirmed OOM kills; allow headroom for login peaks.
        reservations:
          cpus: '0.05'    # Idles on virtually nothing
          memory: 64M     # Soft reservation, not preallocated or guaranteed RAM.
    environment:
      - TZ
      - X_AUTHELIA_CONFIG=/etc/authelia/configuration.yml
      - AUTHELIA_JWT_SECRET_FILE=/run/secrets/authelia_jwt_secret
      - AUTHELIA_SESSION_SECRET_FILE=/run/secrets/authelia_session_secret
      - AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE=/run/secrets/authelia_storage_encryption_key
      - AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET_FILE=/run/secrets/authelia_identity_providers_oidc_hmac_secret_file
      - AUTHELIA_IDENTITY_PROVIDERS_OIDC_ISSUER_CERTIFICATE_CHAIN_FILE=/run/secrets/authelia_identity_providers_oidc_issuer_certificate_chain_file
      - AUTHELIA_IDENTITY_PROVIDERS_OIDC_ISSUER_PRIVATE_KEY_FILE=/run/secrets/authelia_identity_providers_oidc_issuer_private_key_file
    secrets:
      - authelia_jwt_secret
      - authelia_session_secret
      - authelia_storage_encryption_key
      - authelia_identity_providers_oidc_hmac_secret_file
      - authelia_identity_providers_oidc_issuer_certificate_chain_file
      - authelia_identity_providers_oidc_issuer_private_key_file
    labels:
      - "traefik.enable=true"
      ## HTTP Routers
      - "traefik.http.routers.authelia-rtr.entrypoints=https"
      - "traefik.http.routers.authelia-rtr.rule=Host(`auth.$DOMAINNAME_CLOUD_SERVER`)"
      - "traefik.http.routers.authelia-rtr.tls=true"
      ## Middlewares
      - "traefik.http.routers.authelia-rtr.middlewares=middlewares-homer-cors@file,chain-authelia@file"
      # - "traefik.http.routers.authelia-rtr.middlewares=cors@file,chain-authelia@file"
      ## HTTP Services
      - "traefik.http.routers.authelia-rtr.service=authelia-svc"
      - "traefik.http.services.authelia-svc.loadbalancer.server.port=9091"

  # https://www.home-assistant.io/installation/raspberrypi
  homeassistant:
    <<: *common-keys-apps-hostmode # See EXTENSION FIELDS at the top
    deploy:
      resources:
        limits:
          memory: 3G # Observed peak ~1.32 GiB over nine hours; allow startup/maintenance headroom.
        reservations:
          memory: 512M # Soft reservation; validate longer-term integration and recorder workloads.
    cpu_shares: 2048 # Prioritise home automation over background jobs under contention.
    container_name: homeassistant
    image: homeassistant/home-assistant:2026.9.4@sha256:3e6710a7ab2a61311d9d899b719f6c3657791c63e8f4942cec4ebc42401d6b76
    # depends_on:
    #   - influxdb
    network_mode: host
    environment:
      - TZ
    volumes:
      - $VOLUME_DIR/homeassistant:/config
      - $BACKUP_DIR/homeassistant:/config/backups
      - $STACKS_DIR/.git:/config/.homeserver-docker/.git:ro
    labels:
      - "traefik.enable=true"
      ## HTTP Routers
      - "traefik.http.routers.homeassistant-rtr.entrypoints=https"
      - "traefik.http.routers.homeassistant-rtr.priority=1"
      - "traefik.http.routers.homeassistant-rtr.rule=Host(`homeassistant.$DOMAINNAME_CLOUD_SERVER`)"
      - "traefik.http.routers.homeassistant-rtr.tls=true"
      ## Middlewares
      - "traefik.http.routers.homeassistant-rtr.middlewares=middlewares-homer-cors@file,chain-authelia@file"
      ## HTTP Services
      - "traefik.http.routers.homeassistant-rtr.service=homeassistant-svc"
      - "traefik.http.services.homeassistant-svc.loadbalancer.passHostHeader=true"
      - "traefik.http.services.homeassistant-svc.loadbalancer.server.url=http://$DOCKER_SERVER_IP:8123/"
      ## HTTP Routers
      - "traefik.http.routers.homeassistant-webhook-rtr.entrypoints=https"
      - "traefik.http.routers.homeassistant-webhook-rtr.priority=99"
      - "traefik.http.routers.homeassistant-webhook-rtr.rule=Host(`homeassistant.$DOMAINNAME_CLOUD_SERVER`) && ClientIP(`192.168.0.0/16`) && PathPrefix(`/api/`)"
      - "traefik.http.routers.homeassistant-webhook-rtr.tls=true"
      ## Middlewares
      # LAN API requests use this higher-priority router, including Homer's browser preflights.
      - "traefik.http.routers.homeassistant-webhook-rtr.middlewares=middlewares-homer-cors@file,chain-no-auth@file"
      ## HTTP Services
      - "traefik.http.routers.homeassistant-webhook-rtr.service=homeassistant-svc"

  # https://www.homeautomationguy.io/home-assistant-tips/installing-docker-home-assistant-and-portainer-on-ubuntu-linux/
  portainer:
    <<: *common-keys-apps # See EXTENSION FIELDS at the top
    deploy:
      resources:
        limits:
          cpus: '1.0' # Contain runaway CPU use; validate responsiveness during management tasks.
          memory: 256M # Observed peak ~80 MiB; allow headroom for browsing and updates.
        reservations:
          memory: 64M # Soft reservation, not preallocated RAM.
    cpu_shares: 1024 # Normal relative priority under contention, within the CPU ceiling.
    container_name: portainer
    image: portainer/portainer-ce:2.45.1@sha256:4d616db18cfeb5dd41a69c0958bc825c84483ea9cde1106eb82a5d26f3bd8b0e
    restart: always
    command: -H tcp://socket-proxy:2375
    environment:
      - TZ
    volumes:
      - $VOLUME_DIR/portainer:/data
    networks:
      - t2_proxy
      - socket_proxy
    ports:
      - "127.0.0.1:9000:9000/tcp" # don't need to others
    logging:
      driver: none
    labels:
      - "traefik.enable=true"
      ## HTTP Routers
      - "traefik.http.routers.portainer-rtr.entrypoints=https"
      - "traefik.http.routers.portainer-rtr.priority=1"
      - "traefik.http.routers.portainer-rtr.rule=Host(`portainer.$DOMAINNAME_CLOUD_SERVER`)"
      - "traefik.http.routers.portainer-rtr.tls=true"
      ## Middlewares
      - "traefik.http.routers.portainer-rtr.middlewares=middlewares-homer-cors@file,middlewares-admin-headers@file,chain-authelia@file"
      ## HTTP Services
      - "traefik.http.routers.portainer-rtr.service=portainer-svc"
      - "traefik.http.services.portainer-svc.loadbalancer.server.port=9000"
    extra_hosts:
      - "auth.$DOMAINNAME_CLOUD_SERVER:$DOCKER_SERVER_IP" # required for oidc auth

  static-web-server:
    <<: *common-keys-apps # See EXTENSION FIELDS at the top
    deploy:
      resources:
        limits:
          cpus: '1.0' # Contain runaway CPU use; validate concurrent IoT music downloads.
          memory: 64M # Observed peak ~5.5 MiB; validate concurrent IoT music downloads.
        reservations:
          memory: 16M # Soft reservation; file cache also counts toward the limit.
    cpu_shares: 1024 # Normal relative priority under contention, within the CPU ceiling.
    container_name: static-web-sever
    image: joseluisq/static-web-server:2.44.0@sha256:2c1a7c3e0feaea5859307403b74e1c575f3ec1499094fc077344173d11abaae2
    volumes:
      # Serve files without allowing the container to modify them; update files on the host.
      - $VOLUME_DIR/static-web-server/public:/public:ro
    logging:
      driver: none
    networks:
      - t2_proxy
    labels:
      - "traefik.enable=true"
      ## HTTP Routers
      - "traefik.http.routers.staticserver-rtr.entrypoints=https"
      - "traefik.http.routers.staticserver-rtr.priority=1"
      - "traefik.http.routers.staticserver-rtr.rule=Host(`static.$DOMAINNAME_CLOUD_SERVER`)"
      - "traefik.http.routers.staticserver-rtr.tls=true"
      ## Middlewares
      - "traefik.http.routers.staticserver-rtr.middlewares=chain-authelia@file"
      ## HTTP Services
      - "traefik.http.routers.staticserver-rtr.service=staticserver-svc"
      - "traefik.http.services.staticserver-svc.loadbalancer.server.port=80"
      ## IoT ACCESS ; other clients use Authelia above.
      ## HTTP Routers
      - "traefik.http.routers.staticserver-api-rtr.entrypoints=https"
      - "traefik.http.routers.staticserver-api-rtr.priority=99"
      - "traefik.http.routers.staticserver-api-rtr.rule=Host(`static.$DOMAINNAME_CLOUD_SERVER`) && ClientIP(`192.168.2.0/24`)"
      - "traefik.http.routers.staticserver-api-rtr.tls=true"
      ## Middlewares
      - "traefik.http.routers.staticserver-api-rtr.middlewares=chain-no-auth@file"
      ## HTTP Services
      - "traefik.http.routers.staticserver-api-rtr.service=staticserver-svc"

  duplicacy:
    <<: *common-keys-apps # See EXTENSION FIELDS at the top
    # Keep background backup work from monopolising CPU on the shared host.
    deploy:
      resources:
        limits:
          cpus: '2.0' # Aggregate ceiling; does not reserve or pin two cores.
          memory: 1536M # Observed peak ~712 MiB over 43 hours; validate larger backups.
        reservations:
          memory: 256M # Soft reservation, not preallocated RAM.
    cpu_shares: 256 # Lower relative priority under contention (default is 1024).
    container_name: duplicacy
    hostname: 4eb908d4f748 # for licensing
    image: saspus/duplicacy-web:v1.8.3@sha256:f98539e025045cfc6f25cceb73ba3777de2eabe30d5115cc8b858ac42317b88b
    environment:
      - TZ
      - USR_ID=0
      - GRP_ID=0
    volumes:
      - $VOLUME_DIR/duplicacy/config:/config
      - $VOLUME_DIR/duplicacy/logs:/logs
      - $VOLUME_DIR/duplicacy/cache:/cache
      - $VOLUME_DIR:/source/docker/volumes:ro
      - /etc/systemd/system/docker-compose-app.service:/source/etc/systemd/system/docker-compose-app.service:ro
      - /etc/docker/daemon.json:/source/etc/docker/daemon.json:ro
    networks:
      - t2_proxy
    labels:
      - "traefik.enable=true"
      ## HTTP Routers
      - "traefik.http.routers.duplicacy-rtr.entrypoints=https"
      - "traefik.http.routers.duplicacy-rtr.rule=Host(`duplicacy.$DOMAINNAME_CLOUD_SERVER`)"
      - "traefik.http.routers.duplicacy-rtr.tls=true"
      ## Middlewares
      - "traefik.http.routers.duplicacy-rtr.middlewares=middlewares-homer-cors@file,chain-authelia@file"
      ## HTTP Services
      - "traefik.http.routers.duplicacy-rtr.service=duplicacy-svc"
      - "traefik.http.services.duplicacy-svc.loadbalancer.server.port=3875"
    extra_hosts:
      - "homeassistant.$DOMAINNAME_CLOUD_SERVER:192.168.90.254"

  influxdb:
    <<: *common-keys-apps # See EXTENSION FIELDS at the top
    container_name: influxdb
    image: influxdb:2.9.1@sha256:cdd3dbdea45c2f43513abd06ee9644b6e05d2354a2b93ca829c9f07d716eaaac
    environment:
      - TZ
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME_FILE=/run/secrets/influxdb_user
      - DOCKER_INFLUXDB_INIT_PASSWORD_FILE=/run/secrets/influxdb_password
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN_FILE=/run/secrets/influxdb_admin_token
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_ORG}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_BUCKET}
      # - DOCKER_INFLUXDB_INIT_RETENTION=2y
    secrets:
      - influxdb_user
      - influxdb_password
      - influxdb_admin_token
    networks:
      t2_proxy:
        ipv4_address: 192.168.90.253 # You can specify a static IP
    volumes:
      - $VOLUME_DIR/influxdb/data:/var/lib/influxdb2
      - $VOLUME_DIR/influxdb/config/:/etc/influxdb2
    ulimits:
      nofile:
        soft: 32768
        hard: 32768
    labels:
      - "traefik.enable=true"
      ## HTTP Routers
      - "traefik.http.routers.influxdb-rtr.entrypoints=https"
      - "traefik.http.routers.influxdb-rtr.rule=Host(`influxdb.$DOMAINNAME_CLOUD_SERVER`)"
      - "traefik.http.routers.influxdb-rtr.tls=true"
      ## Middlewares
      - "traefik.http.routers.influxdb-rtr.middlewares=middlewares-homer-cors@file,chain-authelia@file"
      ## HTTP Services
      - "traefik.http.routers.influxdb-rtr.service=influxdb-svc"
      - "traefik.http.services.influxdb-svc.loadbalancer.server.port=8086"

  # Zigbee & MQTT
  mosquitto:
    # TODO: mosquito tls (really not needed on a private hosted based network)
    <<: *common-keys-apps # See EXTENSION FIELDS at the top
    deploy:
      resources:
        limits:
          memory: 64M # Observed peak ~13 MiB; recheck retained messages and reconnect bursts.
        reservations:
          memory: 16M # Soft reservation, not preallocated RAM.
    cpu_shares: 2048 # Prioritise MQTT delivery under CPU contention.
    container_name: mosquitto
    image: eclipse-mosquitto:2.0.22@sha256:199ea8ef2e35ec2b1b37e59cfd1dbae538ed4dfa4a2251a121a52215a6248a21
    networks:
      t2_proxy:
        ipv4_address: 192.168.90.252 # You can specify a static IP
    volumes:
      - $VOLUME_DIR/mosquitto/config:/mosquitto/config
    ports:
      - "127.0.0.1:1883:1883/tcp"
      # - 9001:9001 # not using websockets
    command: "mosquitto -c /mosquitto/config/mosquitto.conf"
    labels:
      - "traefik.enable=false"

  zigbee2mqtt:
    <<: *common-keys-apps # See EXTENSION FIELDS at the top
    deploy:
      resources:
        limits:
          memory: 512M # Observed peak ~210 MiB; validate restarts and device updates.
        reservations:
          memory: 128M # Soft reservation, not preallocated RAM.
    cpu_shares: 2048 # Prioritise device control under CPU contention.
    container_name: zigbee2mqtt
    image: koenkk/zigbee2mqtt:2.14.2@sha256:addbfb08fcef2e4477de1535636118241e10d13e898fbe4d9faba8a4d7396311
    volumes:
      - $VOLUME_DIR/zigbee2mqtt/data:/app/data
      - /run/udev:/run/udev:ro
    ports:
      - "127.0.0.1:8080:8080/tcp"
    environment:
      - TZ
      - ZIGBEE2MQTT_CONFIG_permit_join=true
    secrets:
      - zigbee2mqtt_secrets.yaml
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
    labels:
      - "traefik.enable=true"
      ## HTTP Routers
      - "traefik.http.routers.zigbee2mqtt-rtr.entrypoints=https"
      - "traefik.http.routers.zigbee2mqtt-rtr.rule=Host(`zigbee2mqtt.$DOMAINNAME_CLOUD_SERVER`)"
      - "traefik.http.routers.zigbee2mqtt-rtr.tls=true"
      ## Middlewares
      - "traefik.http.routers.zigbee2mqtt-rtr.middlewares=middlewares-homer-cors@file,chain-authelia@file"
      ## HTTP Services
      - "traefik.http.routers.zigbee2mqtt-rtr.service=zigbee2mqtt-svc"
      - "traefik.http.services.zigbee2mqtt-svc.loadbalancer.server.port=8080"

  # NodeRED
  node-red:
    <<: *common-keys-apps # See EXTENSION FIELDS at the top
    deploy:
      resources:
        limits:
          memory: 768M # Observed peak ~288 MiB; validate the largest scheduled flows.
        reservations:
          memory: 192M # Soft reservation, not preallocated RAM.
    cpu_shares: 2048 # Prioritise automation flows under CPU contention.
    image: nodered/node-red:4.1.15-22-minimal@sha256:5b4b3de279526288906521476d49c032dcbd15f5703c8fcc64cf26b73ad16199
    container_name: node-red
    environment:
      - TZ
    ports:
      - "127.0.0.1:1880:1880/tcp"
    volumes:
      - $VOLUME_DIR/nodered/data:/data
      - $BACKUP_DIR/energy-data:/energy-data
    labels:
      - "traefik.enable=true"
      ## HTTP Routers
      - "traefik.http.routers.nodered-rtr.entrypoints=https"
      - "traefik.http.routers.nodered-rtr.rule=Host(`nodered.$DOMAINNAME_CLOUD_SERVER`)"
      - "traefik.http.routers.nodered-rtr.tls=true"
      ## Middlewares
      - "traefik.http.routers.nodered-rtr.middlewares=middlewares-homer-cors@file,chain-authelia@file"
      ## HTTP Services
      - "traefik.http.routers.nodered-rtr.service=nodered-svc"
      - "traefik.http.services.nodered-svc.loadbalancer.server.port=1880"
      ## Same-origin Homer feed: configure Homer message.url as /dashboard-endpoint.
      ## Keep the Node-RED path unchanged; the browser sends its session cookie without cross-origin CORS.
      - "traefik.http.routers.homer-rss-rtr.entrypoints=https"
      - "traefik.http.routers.homer-rss-rtr.priority=98" # Higher than Homer's catch-all router.
      - "traefik.http.routers.homer-rss-rtr.rule=Host(`home.$DOMAINNAME_CLOUD_SERVER`) && Path(`/dashboard-endpoint`) && Method(`GET`)"
      - "traefik.http.routers.homer-rss-rtr.tls=true"
      - "traefik.http.routers.homer-rss-rtr.middlewares=chain-authelia@file"
      - "traefik.http.routers.homer-rss-rtr.service=nodered-svc"
    extra_hosts:
      - "homeassistant.$DOMAINNAME_CLOUD_SERVER:192.168.90.254"

  # Homer
  homer:
    <<: *common-keys-apps # See EXTENSION FIELDS at the top
    deploy:
      resources:
        limits:
          cpus: '0.50' # Initial safety ceiling for the lightweight dashboard; monitor throttling.
          memory: 64M # Observed peak ~6.3 MiB; leave headroom for startup and asset requests.
        reservations:
          memory: 16M # Soft reservation, not preallocated RAM.
    cpu_shares: 1024 # Normal relative priority under contention, within the CPU ceiling.
    image: b4bz/homer:v26.08.3@sha256:febc8967c9f7648ec37633ef3ae1ec90dbe8b7c46fecab80299f08f05be7ecb6
    container_name: homer
    volumes:
      - $VOLUME_DIR/homer/assets/:/www/assets:ro
      - $VOLUME_DIR/homer/custom-assets/:/www/custom-assets:ro
    user: $PUID:$PGID
    environment:
      - INIT_ASSETS=0 # default
      - IPV6_DISABLE=1
    labels:
      - "traefik.enable=true"
      ## HTTP Routers
      - "traefik.http.routers.homer-rtr.entrypoints=https"
      - "traefik.http.routers.homer-rtr.rule=Host(`home.$DOMAINNAME_CLOUD_SERVER`)"
      - "traefik.http.routers.homer-rtr.tls=true"
      ## Middlewares
      - "traefik.http.routers.homer-rtr.middlewares=chain-authelia@file"
      ## HTTP Services
      - "traefik.http.routers.homer-rtr.service=homer-svc"
      - "traefik.http.services.homer-svc.loadbalancer.server.port=8080"

configs:
  authelia_configuration:
    file: ./authelia/configuration.yml
  traefik_rules_esphome:
    file: ./traefik/rules/esphome.yml
  traefik_rules_tls_opts:
    file: ./traefik/rules/tls-opts.yml
  traefik_rules_printerscanner:
    file: ./traefik/rules/printerscanner.yml
  traefik_printerscanner_certificate:
    file: ./traefik/certs/printerscanner.pem
  traefik_rules_middlewares_chains:
    file: ./traefik/rules/middlewares-chains.yml
  traefik_rules_middlewares:
    file: ./traefik/rules/middlewares.yml
  traefik_rules_immich:
    file: ./traefik/rules/immich.yml
