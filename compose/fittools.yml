services:
  fittools:
    container_name: fittools
    image: ghcr.io/jacobfg/garmin-fit-scripts:0.2.0@sha256:8f1489ee7b63296d501d939daff2013db006347190358588c656fce903c58a69
    restart: unless-stopped
    user: $PUID:$PGID
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 128M
    environment:
      - TZ=$TZ
    networks:
      - fittools_internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=fittools_internal"
      ## HTTP Routers
      - "traefik.http.routers.fittools-rtr.entrypoints=https"
      - "traefik.http.routers.fittools-rtr.rule=Host(`fittools.$DOMAINNAME_CLOUD_SERVER`)"
      - "traefik.http.routers.fittools-rtr.tls=true"
      ## Middlewares
      - "traefik.http.routers.fittools-rtr.middlewares=chain-authelia@file"
      ## HTTP Services
      - "traefik.http.routers.fittools-rtr.service=fittools-svc"
      - "traefik.http.services.fittools-svc.loadbalancer.server.port=8080"
