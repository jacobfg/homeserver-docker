http:
  middlewares:

    middlewares-rate-limit:
      rateLimit:
        average: 100
        # burst: 50
        burst: 200 # for immich - see https://github.com/immich-app/immich/discussions/12906#discussioncomment-14529114

    middlewares-secure-headers:
      headers:
        # Application CORS belongs on specific routes when needed.
        stsSeconds: 63072000
        stsIncludeSubdomains: true
        stsPreload: true
        forceSTSHeader: true
        # Preserve application-owned CSP and frame policies for embedded panels.
        contentTypeNosniff: true
        referrerPolicy: "same-origin"
        # Applications control camera/microphone permissions; admin UIs deny them below.
        customResponseHeaders:
          X-XSS-Protection: "0" # Disable the obsolete browser XSS filter.
          X-Robots-Tag: "none,noarchive,nosnippet,notranslate,noimageindex,"
          server: ""

    middlewares-admin-headers:
      headers:
        # Apply only to standalone admin dashboards, not embedded application panels.
        frameDeny: true
        permissionsPolicy: "camera=(), microphone=(), geolocation=(), payment=(), usb=(), xr-spatial-tracking=()"
        # Leave each application's Content-Security-Policy intact.

    middlewares-authelia:
      forwardAuth:
        # Authelia selects the login URL from session.cookies for the requested domain.
        address: 'http://authelia:9091/api/authz/forward-auth'
        trustForwardHeader: true
        authResponseHeaders:
          - "Remote-User"
          - "Remote-Groups"
          # - "Remote-Name"
          # - "Remote-Email"

    middlewares-compress:
      compress:
        # Simple baseline for the Mini PC; benchmark before enabling other encoders.
        encodings:
          - gzip
        minResponseBodyBytes: 2048
        # Compress web/API content only; skip media, archives and text/event-stream.
        # Upstream Content-Encoding is preserved rather than recompressing responses.
        includedContentTypes:
          - text/html
          - text/plain
          - text/css
          - text/javascript
          - application/javascript
          - application/json
          - application/xml
          - text/xml
          - image/svg+xml
    
