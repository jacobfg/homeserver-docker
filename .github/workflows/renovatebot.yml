name: Renovate Bot
on:
  workflow_dispatch:
  schedule:
   - cron: '4 */6 * * *'
  # push:
  #   branches:
  #     - dev

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Renovate
        uses: renovatebot/github-action@230ce922b08968d0a4f6f70f295601daff09ef1d # v46.3.7
        with:
          configurationFile: .github/renovate.json5
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          # Repository taken from variable to keep configuration file generic
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # Onboarding not needed for self hosted
          RENOVATE_ONBOARDING: "false"
          # Git commit author used, must match GitHub App
          RENOVATE_GIT_AUTHOR: "Renovate Bot for me <10949267+jacobfg@users.noreply.github.com>"
          # Authenticate private GHCR lookups with the classic PAT as the password
          RENOVATE_HOST_RULES: >-
            [{
              "hostType": "docker",
              "matchHost": "ghcr.io",
              "username": ${{ toJSON(secrets.RENOVATE_READ_USER) }},
              "password": ${{ toJSON(secrets.RENOVATE_READ_TOKEN) }}
            }]
          # LOG_LEVEL: 'debug'
